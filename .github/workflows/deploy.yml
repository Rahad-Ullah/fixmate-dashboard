name: CI/CD Deploy

on:
  push:
    branches:
      - production # Deploy on pushes to production branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js (match your server's Node version)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3. Install dependencies (optional, only for CI testing)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 4. Build project (optional, if you need build step before deployment)
      - name: Build
        run: yarn build

      # 5. Deploy over SSH
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/fixmate/fixmate-dashboard
            git pull origin production
            yarn install --frozen-lockfile
            yarn build
            pm2 restart fixmate-dashboard || pm2 start "yarn start" --name fixmate-dashboard
