name: Deploy to VPS

on:
  push:
    branches:
      - production # Change to 'main' if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            source ~/.bashrc
            cd ${{ secrets.APP_DIR }}
            git pull origin production
            yarn install --frozen-lockfile
            yarn build
            pm2 reload fixmate-dashboard --update-env || pm2 start "yarn start" --name fixmate-dashboard
            pm2 save fixmate-dashboard
          request_pty: true
